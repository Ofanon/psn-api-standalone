<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testeur PSN API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 0.9em;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .api-url {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .api-url label {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .api-url input {
            border: 1px solid #ddd;
            padding: 8px 12px;
            font-size: 0.9em;
            background: white;
        }

        .endpoints {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .endpoint-btn {
            padding: 12px 16px;
            background: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #333;
            transition: all 0.3s;
            text-align: left;
        }

        .endpoint-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .endpoint-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response {
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.85em;
            color: #333;
        }

        .response.success {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .response.error {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .status.connected {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .session-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .session-info strong {
            color: #1e40af;
        }

        .copy-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85em;
            padding: 0;
        }

        .copy-btn:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Testeur PSN API</h1>

        <div class="grid">
            <!-- Configuration -->
            <div class="card">
                <h2>⚙️ Configuration</h2>
                
                <div class="api-url">
                    <label for="apiUrl">URL de l'API Render:</label>
                    <input 
                        type="text" 
                        id="apiUrl" 
                        placeholder="https://psn-api-standalone.onrender.com"
                        value="https://psn-api-standalone.onrender.com"
                    >
                </div>

                <div id="status" class="status disconnected">
                    ⚪ Non connecté
                </div>

                <h3 style="color: #667eea; margin-top: 20px; margin-bottom: 15px; font-size: 1.1em;">
                    Authentification
                </h3>

                <div class="form-group">
                    <label for="username">Nom d'utilisateur (email):</label>
                    <input type="email" id="username" placeholder="ton.email@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe:</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>

                <button class="btn-primary" onclick="authenticate()" style="width: 100%;">
                    🔐 S'authentifier
                </button>

                <div id="sessionInfo" class="session-info" style="display: none; margin-top: 15px;">
                    <strong>Session ID:</strong> <span id="sessionId"></span>
                    <button class="copy-btn" onclick="copySessonId()">Copier</button>
                    <div style="margin-top: 8px; font-size: 0.85em; color: #666;">
                        Expire dans 4h
                    </div>
                </div>
            </div>

            <!-- Endpoints -->
            <div class="card">
                <h2>📡 Endpoints</h2>

                <div class="endpoints">
                    <button class="endpoint-btn" onclick="testHealth()">
                        ✅ GET /health
                    </button>
                    <button class="endpoint-btn" id="logbookBtn" onclick="fetchLogbook()" disabled>
                        📖 POST /logbook
                    </button>
                    <button class="endpoint-btn" id="gradesBtn" onclick="fetchGrades()" disabled>
                        📊 POST /grades
                    </button>
                    <button class="endpoint-btn" id="homeworkBtn" onclick="fetchHomework()" disabled>
                        ✏️ POST /homework
                    </button>
                </div>

                <button class="btn-secondary" onclick="clearResponse()" style="width: 100%; margin-top: 15px;">
                    🗑️ Effacer la réponse
                </button>
            </div>
        </div>

        <!-- Réponse API -->
        <div class="card">
            <h2>📋 Réponse API</h2>
            <div id="response" class="response">
                <em style="color: #999;">Les réponses apparaîtront ici...</em>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let apiUrl = 'https://psn-api-standalone.onrender.com';

        // Récupérer l'URL API depuis le champ
        document.getElementById('apiUrl').addEventListener('change', function() {
            apiUrl = this.value.trim().replace(/\/$/, '');
            updateStatus();
        });

        // Initialisation
        document.getElementById('apiUrl').value = apiUrl;

        async function updateStatus() {
            try {
                const response = await fetch(`${apiUrl}/health`);
                if (response.ok) {
                    document.getElementById('status').className = 'status connected';
                    document.getElementById('status').textContent = '🟢 API opérationnelle';
                } else {
                    throw new Error('Réponse non valide');
                }
            } catch (error) {
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = '🔴 API indisponible';
            }
        }

        function showResponse(data, isError = false) {
            const responseDiv = document.getElementById('response');
            responseDiv.className = `response ${isError ? 'error' : 'success'}`;
            responseDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        function clearResponse() {
            document.getElementById('response').className = 'response';
            document.getElementById('response').innerHTML = '<em style="color: #999;">Les réponses apparaîtront ici...</em>';
        }

        async function testHealth() {
            try {
                const response = await fetch(`${apiUrl}/health`);
                const data = await response.json();
                showResponse(data);
                updateStatus();
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function authenticate() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showResponse({ error: 'Veuillez entrer un email et un mot de passe' }, true);
                return;
            }

            try {
                document.getElementById('status').innerHTML = '<span class="loading">⏳</span> Authentification en cours...';

                const response = await fetch(`${apiUrl}/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showResponse(data, true);
                    updateStatus();
                    return;
                }

                sessionId = data.sessionId;
                document.getElementById('sessionId').textContent = sessionId;
                document.getElementById('sessionInfo').style.display = 'block';
                
                ['logbookBtn', 'gradesBtn', 'homeworkBtn'].forEach(id => {
                    document.getElementById(id).disabled = false;
                });

                showResponse(data);
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = '🟢 Authentifié !';
            } catch (error) {
                showResponse({ error: error.message }, true);
                updateStatus();
            }
        }

        async function fetchLogbook() {
            if (!sessionId) {
                showResponse({ error: 'Veuillez vous authentifier d\'abord' }, true);
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/logbook`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });

                const data = await response.json();
                showResponse(data, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function fetchGrades() {
            if (!sessionId) {
                showResponse({ error: 'Veuillez vous authentifier d\'abord' }, true);
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/grades`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });

                const data = await response.json();
                showResponse(data, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        async function fetchHomework() {
            if (!sessionId) {
                showResponse({ error: 'Veuillez vous authentifier d\'abord' }, true);
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/homework`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId })
                });

                const data = await response.json();
                showResponse(data, !response.ok);
            } catch (error) {
                showResponse({ error: error.message }, true);
            }
        }

        function copySessonId() {
            const sessionId = document.getElementById('sessionId').textContent;
            navigator.clipboard.writeText(sessionId).then(() => {
                alert('Session ID copié !');
            });
        }

        // Initialiser le statut au chargement
        window.addEventListener('load', updateStatus);
    </script>
</body>
</html>
